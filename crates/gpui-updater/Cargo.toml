[package]
name = "gpui-updater"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Observable updater adapter for official GPUI"
readme = "../../README.md"
keywords = ["gpui", "updater", "auto-update", "desktop"]
categories = ["gui", "development-tools"]

[features]
default = []
# Delta-first downloads with automatic fallback; see gpui-updater-core.
delta = ["gpui-updater-core/delta"]

[dependencies]
# Carries `DriverEvent`s from an external update driver onto the GPUI
# foreground. GPUI already depends on `futures`.
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui-updater-core = { version = "0.3.0", path = "../gpui-updater-core" }
gpui = { version = "0.2.2", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
