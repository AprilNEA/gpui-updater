[package]
name = "gpui-updater"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Observable updater adapter for official GPUI"
readme = "../../README.md"
keywords = ["gpui", "updater", "auto-update", "desktop"]
categories = ["gui", "development-tools"]

[dependencies]
gpui-updater-core = { version = "0.1.0", path = "../gpui-updater-core" }
gpui = { version = "0.2.2", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
