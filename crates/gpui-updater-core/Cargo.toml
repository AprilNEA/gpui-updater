[package]
name = "gpui-updater-core"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Blocking cross-platform update engine, independent of GPUI"
readme = "../../README.md"
keywords = ["updater", "auto-update", "self-update", "desktop"]
categories = ["development-tools"]

[features]
default = []
# Binary delta updates: `delta::create` for release CI, and delta-first
# downloads in `UpdateEngine` with automatic fallback to the full artifact.
delta = ["dep:qbsdiff", "dep:bzip2", "dep:lzma-rust2"]

[dependencies]
base64 = "0.22"
bzip2 = { version = "0.6", optional = true }
# Pure-Rust Ed25519, used to verify Sparkle's `sparkle:edSignature`. No default
# features: verification needs neither key generation nor PEM support.
ed25519-compact = { version = "2.1", default-features = false }
lzma-rust2 = { version = "0.22", optional = true, default-features = false, features = ["std", "encoder"] }
minisign-verify = "0.2.5"
qbsdiff = { version = "1.4", optional = true, default-features = false }
roxmltree = "0.20"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[dev-dependencies]
minisign = "0.7"
tempfile = "3"

[[example]]
name = "make_delta"
required-features = ["delta"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Document the `delta` feature too, with "Available on crate feature" labels.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
