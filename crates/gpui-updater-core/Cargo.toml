[package]
name = "gpui-updater-core"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Blocking cross-platform update engine, independent of GPUI"
readme = "../../README.md"
keywords = ["updater", "auto-update", "self-update", "desktop"]
categories = ["development-tools"]

[dependencies]
minisign-verify = "0.2.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
