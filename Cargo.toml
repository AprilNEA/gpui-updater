[workspace]
members = ["crates/gpui-updater-core", "crates/gpui-updater", "crates/gpui-updater-pre"]
default-members = ["crates/gpui-updater-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AprilNEA/gpui-updater"
authors = ["AprilNEA <dev@aprilnea.me>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
# Noisy pedantic lints: flagging every value-returning fn / public-method
# argument adds churn without catching real bugs here.
must_use_candidate = "allow"
needless_pass_by_value = "allow"
